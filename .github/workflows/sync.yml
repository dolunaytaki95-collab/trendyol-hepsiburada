import os
import requests
import json
import time
import hashlib
import unicodedata
import re
from datetime import datetime


# ============================================================
# AYARLAR
# ============================================================

TRENDYOL_BASE = "https://apigw.trendyol.com"
HB_BASE = "https://mpop-sit.hepsiburada.com"

TY_PAGE_SIZE = 100
HB_PAGE_SIZE = 1000


# ============================================================
# GITHUB SECRETS
# ============================================================

SUPPLIER_ID = os.environ["TY_SUPPLIER_ID"]
TY_API_KEY = os.environ["TY_API_KEY"]
TY_API_SECRET = os.environ["TY_API_SECRET"]

HB_MERCHANT_ID = os.environ["HB_MERCHANT_ID"]
HB_SECRET_KEY = os.environ["HB_SECRET_KEY"]
HB_USERNAME = os.environ["HB_USERNAME"]


# ============================================================
# LOG
# ============================================================

def log(text):
    print(
        f"[{datetime.now().strftime('%d.%m.%Y %H:%M:%S')}] {text}"
    )


# ============================================================
# YARDIMCI
# ============================================================

def safe(value):
    return "" if value is None else str(value).strip()


def normalize(value):
    s = safe(value).lower()

    table = str.maketrans({
        "ı": "i",
        "ş": "s",
        "ğ": "g",
        "ü": "u",
        "ö": "o",
        "ç": "c"
    })

    s = s.translate(table)

    s = unicodedata.normalize("NFKD", s)

    s = "".join(
        c for c in s
        if not unicodedata.combining(c)
    )

    s = re.sub(
        r"[^a-z0-9 ]+",
        " ",
        s
    )

    return re.sub(
        r"\s+",
        " ",
        s
    ).strip()


# ============================================================
# TRENDYOL
# ============================================================

def get_trendyol_products():

    url = (
        f"{TRENDYOL_BASE}"
        f"/integration/product/sellers/"
        f"{SUPPLIER_ID}/products/approved"
    )

    headers = {
        "User-Agent":
            f"{SUPPLIER_ID} - SelfIntegration",
        "Accept":
            "application/json"
    }

    products = []

    page = 0

    while True:

        response = requests.get(
            url,
            headers=headers,
            auth=(
                TY_API_KEY,
                TY_API_SECRET
            ),
            params={
                "page": page,
                "size": TY_PAGE_SIZE
            },
            timeout=60
        )

        log(
            f"📡 Trendyol Sayfa {page + 1} | "
            f"HTTP: {response.status_code}"
        )

        if response.status_code != 200:
            raise Exception(
                f"Trendyol HTTP {response.status_code}: "
                f"{response.text[:2000]}"
            )

        data = response.json()

        content = data.get(
            "content",
            []
        )

        for product in content:

            variants = product.get(
                "variants",
                []
            ) or []

            for variant in variants:

                barcode = safe(
                    variant.get("barcode")
                )

                if not barcode:
                    continue

                images = []

                for image in (
                    product.get("images", [])
                    or []
                ):

                    if isinstance(
                        image,
                        dict
                    ):

                        image_url = (
                            image.get("url")
                            or
                            image.get("imageUrl")
                        )

                    else:

                        image_url = image

                    if image_url:
                        images.append(
                            safe(image_url)
                        )

                price = variant.get(
                    "price",
                    {}
                )

                stock = variant.get(
                    "stock",
                    {}
                )

                products.append({

                    "barcode":
                        barcode,

                    "title":
                        safe(
                            product.get(
                                "title"
                            )
                        ),

                    "description":
                        safe(
                            product.get(
                                "description"
                            )
                        ),

                    "price":
                        price.get(
                            "salePrice",
                            price.get(
                                "listPrice",
                                0
                            )
                        ),

                    "stock":
                        stock.get(
                            "quantity",
                            0
                        ),

                    "images":
                        images,

                    "category":
                        safe(
                            product.get(
                                "categoryName"
                            )
                        ),

                    "productMainId":
                        safe(
                            product.get(
                                "productMainId"
                            )
                        ),

                    "productCode":
                        safe(
                            product.get(
                                "productCode"
                            )
                        ),

                    "stockCode":
                        safe(
                            variant.get(
                                "stockCode"
                            )
                        ),

                    "brand":
                        product.get(
                            "brand"
                        ),

                    "attributes":
                        product.get(
                            "attributes",
                            []
                        ),

                    "variantAttributes":
                        variant.get(
                            "attributes",
                            []
                        )
                })

        log(
            f"📦 Sayfa {page + 1}: "
            f"{len(content)} ana ürün | "
            f"Toplam varyant: {len(products)}"
        )

        total_pages = data.get(
            "totalPages"
        )

        if total_pages is not None:

            if page + 1 >= int(
                total_pages
            ):
                break

        elif len(content) < TY_PAGE_SIZE:

            break

        page += 1

    return products


# ============================================================
# HEPSİBURADA KATEGORİLER
# ============================================================

def get_hb_categories():

    url = (
        f"{HB_BASE}"
        "/product/api/categories/get-all-categories"
    )

    categories = []

    page = 0

    while True:

        response = requests.get(
            url,
            headers={
                "User-Agent":
                    HB_USERNAME,
                "Accept":
                    "application/json"
            },
            auth=(
                HB_MERCHANT_ID,
                HB_SECRET_KEY
            ),
            params={
                "leaf": "true",
                "status": "ACTIVE",
                "available": "true",
                "page": page,
                "size": HB_PAGE_SIZE
            },
            timeout=60
        )

        log(
            f"📂 HB kategori sayfa {page + 1} | "
            f"HTTP: {response.status_code}"
        )

        if response.status_code != 200:
            raise Exception(
                f"HB kategori HTTP "
                f"{response.status_code}: "
                f"{response.text[:2000]}"
            )

        data = response.json()

        items = data.get(
            "data",
            []
        )

        categories.extend(
            items
        )

        total_pages = data.get(
            "totalPages"
        )

        if total_pages is not None:

            if page + 1 >= int(
                total_pages
            ):
                break

        elif len(items) < HB_PAGE_SIZE:

            break

        page += 1

    return categories


# ============================================================
# KATEGORİ EŞLEŞTİR
# ============================================================

def category_text(category):

    paths = category.get(
        "paths",
        []
    )

    return normalize(
        " ".join(
            [
                safe(
                    category.get(
                        "name"
                    )
                ),

                safe(
                    category.get(
                        "displayName"
                    )
                ),

                *[
                    safe(x)
                    for x in paths
                ]
            ]
        )
    )


def find_category(
    product,
    categories
):

    source = normalize(
        product["category"]
        + " "
        + product["title"]
    )

    if "bileklik" in source:
        keys = [
            "bileklik",
            "sahmeran"
        ]

    elif "kolye" in source:
        keys = [
            "kolye"
        ]

    elif "kupe" in source:
        keys = [
            "kupe"
        ]

    elif "yuzuk" in source:
        keys = [
            "yuzuk"
        ]

    elif "piercing" in source:
        keys = [
            "piercing"
        ]

    elif "sahmeran" in source:
        keys = [
            "sahmeran",
            "bileklik"
        ]

    else:
        keys = []

    best = None
    best_score = 0

    for category in categories:

        if not isinstance(
            category,
            dict
        ):
            continue

        text = category_text(
            category
        )

        score = 0

        for key in keys:

            if key in text:
                score += 100

        for word in normalize(
            product["category"]
        ).split():

            if (
                len(word) >= 4
                and word in text
            ):
                score += 20

        if score > best_score:

            best_score = score
            best = category

    return best


# ============================================================
# KATEGORİ ÖZELLİKLERİ
# ============================================================

def get_attributes(
    category_id
):

    url = (
        f"{HB_BASE}"
        f"/product/api/categories/"
        f"{category_id}/attributes"
    )

    response = requests.get(

        url,

        headers={
            "User-Agent":
                HB_USERNAME,
            "Accept":
                "application/json"
        },

        auth=(
            HB_MERCHANT_ID,
            HB_SECRET_KEY
        ),

        params={
            "version": 2
        },

        timeout=60
    )

    log(
        f"📋 Kategori özellik HTTP: "
        f"{response.status_code}"
    )

    if response.status_code != 200:
        return []

    data = response.json()

    if isinstance(
        data,
        list
    ):
        return data

    if isinstance(
        data,
        dict
    ):

        return (
            data.get("data")
            or
            data.get("attributes")
            or
            data.get("content")
            or
            []
        )

    return []


# ============================================================
# ÜRÜN OLUŞTUR
# ============================================================

def create_hb_product(
    product,
    category,
    hb_attributes
):

    price = product["price"]

    try:

        price = (
            f"{float(price):.2f}"
            .replace(".", ",")
        )

    except:

        price = "0,00"

    try:

        stock = str(
            int(
                float(
                    product["stock"]
                )
            )
        )

    except:

        stock = "0"

    sku = (
        product["stockCode"]
        or
        product["productCode"]
        or
        product["barcode"]
    )

    brand = product["brand"]

    if isinstance(
        brand,
        dict
    ):

        brand = brand.get(
            "name",
            ""
        )

    brand = safe(brand)

    if not brand:
        brand = "Dolunay Takı"

    attributes = {

        "merchantSku":
            sku,

        "VaryantGroupID":
            product["productMainId"]
            or sku,

        "Barcode":
            product["barcode"],

        "UrunAdi":
            product["title"],

        "UrunAciklamasi":
            product["description"],

        "Marka":
            brand,

        "GarantiSuresi":
            0,

        "kg":
            "1",

        "price":
            price,

        "stock":
            stock
    }


    # GÖRSELLER

    for i, image in enumerate(
        product["images"][:10],
        start=1
    ):

        attributes[
            f"Image{i}"
        ] = image


    # TRENDYOL ÖZELLİKLERİ

    for attr in product[
        "attributes"
    ] or []:

        if not isinstance(
            attr,
            dict
        ):
            continue

        name = (
            attr.get(
                "attributeName"
            )
            or
            attr.get("name")
        )

        value = (
            attr.get(
                "attributeValue"
            )
            or
            attr.get("value")
        )

        if name and value:

            attributes[
                name
            ] = value


    # HB kategori özellikleri

    for attr in hb_attributes:

        if not isinstance(
            attr,
            dict
        ):
            continue

        name = (
            attr.get("name")
            or
            attr.get("isim")
        )

        if not name:
            continue

        normalized_name = normalize(
            name
        )

        # Trendyol'dan aynı isimde alan varsa
        # onu kullan
        for existing_name in list(
            attributes.keys()
        ):

            if normalize(
                existing_name
            ) == normalized_name:

                break

    return {

        "categoryId":
            category["categoryId"],

        "merchant":
            HB_MERCHANT_ID,

        "attributes":
            attributes
    }


# ============================================================
# HB IMPORT
# ============================================================

def upload_products(
    products
):

    if not products:

        log(
            "⚠️ Gönderilecek ürün yok."
        )

        return

    url = (
        f"{HB_BASE}"
        "/product/api/products/import"
    )

    filename = (
        "hepsiburada_import_"
        +
        datetime.now().strftime(
            "%Y%m%d_%H%M%S"
        )
        +
        ".json"
    )

    with open(
        filename,
        "w",
        encoding="utf-8"
    ) as f:

        json.dump(
            products,
            f,
            ensure_ascii=False,
            indent=2
        )

    log(
        f"📄 JSON oluşturuldu: "
        f"{filename}"
    )

    with open(
        filename,
        "rb"
    ) as f:

        response = requests.post(

            url,

            headers={
                "User-Agent":
                    HB_USERNAME,
                "Accept":
                    "application/json"
            },

            auth=(
                HB_MERCHANT_ID,
                HB_SECRET_KEY
            ),

            files={
                "file": (
                    filename,
                    f,
                    "application/json"
                )
            },

            timeout=180
        )

    log(
        f"📡 HB ürün import HTTP: "
        f"{response.status_code}"
    )

    print(
        response.text[:10000]
    )

    if response.status_code not in (
        200,
        201,
        202
    ):

        raise Exception(
            f"HB import hatası: "
            f"{response.status_code}"
        )


# ============================================================
# TEK SENKRONİZASYON
# ============================================================

def synchronize():

    log(
        "🔄 Senkronizasyon başladı."
    )

    products = get_trendyol_products()

    log(
        f"✅ Trendyol varyant sayısı: "
        f"{len(products)}"
    )

    categories = get_hb_categories()

    log(
        f"✅ HB kategori sayısı: "
        f"{len(categories)}"
    )

    hb_products = []

    for index, product in enumerate(
        products,
        start=1
    ):

        category = find_category(
            product,
            categories
        )

        if not category:

            log(
                f"⚠️ Kategori bulunamadı: "
                f"{product['title']}"
            )

            continue

        category_id = category[
            "categoryId"
        ]

        log(
            f"🔄 [{index}/{len(products)}] "
            f"{product['title']}"
        )

        attributes = get_attributes(
            category_id
        )

        hb_product = create_hb_product(
            product,
            category,
            attributes
        )

        hb_products.append(
            hb_product
        )

    log(
        f"✅ Hazırlanan HB ürün: "
        f"{len(hb_products)}"
    )

    upload_products(
        hb_products
    )

    log(
        "✅ Senkronizasyon tamamlandı."
    )


# ============================================================
# ÇALIŞTIR
# ============================================================

if __name__ == "__main__":

    synchronize()
